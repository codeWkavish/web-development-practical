
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>Spendly.</h2>
        <p>Student Expense Tracker</p>
    </header>

    <main>

        <section class="welcome">
            <h1>Manage your money better.</h1>
            <p>Keep track of your daily spending and stay on budget.</p>
        </section>

        <!-- Summary Cards -->

        <section class="summary">

            <div class="card">
                <p>Total Expenses</p>
                <h2 id="total">₹0</h2>
            </div>

            <div class="card">
                <p>Total Transactions</p>
                <h2 id="count">0</h2>
            </div>

            <div class="card">
                <p>Average Expense</p>
                <h2 id="average">₹0</h2>
            </div>

        </section>

        <!-- Add Expense -->

        <section class="expense-form">

            <h2>Add New Expense</h2>

            <form id="expenseForm">

                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount (₹)"
                    min="0.01"
                    step="0.01"
                >

                <select id="category">
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">+ Add Expense</button>

            </form>

        </section>

        <!-- Expense List -->

        <section class="expense-section">

            <div class="expense-heading">
                <h2>Recent Expenses</h2>

                <select id="filter">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Enterntainment">Enterntainment</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div id="expenseList">
                <p class="empty">No expenses added yet.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Made for students, with simplicity. ✦</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
